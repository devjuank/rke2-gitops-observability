# workload-api in namespace `app`. Applied by `make deploy` (and by Argo CD from step 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml # needs the Prometheus Operator CRDs (make deploy installs them first)

# The only place the image tag lives. CI updates it with
# `kustomize edit set image` (step 8). Always an immutable sha- tag, never latest.
images:
  - name: ghcr.io/devjuank/workload-api
    newTag: sha-bb7db68
