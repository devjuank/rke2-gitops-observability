# Tells the Prometheus Operator to scrape every pod behind the workload-api
# Service. Prometheus is configured to discover ServiceMonitors in all namespaces.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-api
  labels:
    app.kubernetes.io/name: workload-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-api
  endpoints:
    - port: http # the Service's named port
      path: /metrics
      interval: 15s
