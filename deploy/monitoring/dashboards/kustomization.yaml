# Packs workload-api.json into a ConfigMap. Grafana's sidecar loads every
# ConfigMap labeled grafana_dashboard: "1", so no manual import is needed.
# Edit the JSON (or export it from Grafana) and re-run `make deploy`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true # stable name; the sidecar picks up changes in place
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-workload-api
    files:
      - workload-api.json
