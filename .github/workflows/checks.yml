# Validation only: publishes nothing and never commits, so it can't trigger
# itself. Runs on pull requests (main is protected: these checks are required
# to merge), on main itself, and as the first stage of the release workflow.
# See docs/DECISIONS.md §9d.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go (fmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform (checksum-verified)
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Validate against Kubernetes 1.36 and CRD schemas
        # CRD schemas (ServiceMonitor, HelmChart, HelmChartConfig, Application) come from the datree CRDs catalog.
        run: |
          {
            kubectl kustomize deploy/app; echo "---"
            kubectl kustomize deploy/monitoring/dashboards; echo "---"
            cat deploy/monitoring/kube-prometheus-stack.yaml; echo "---"
            cat deploy/argocd/argo-cd.yaml; echo "---"
            cat deploy/argocd/application.yaml; echo "---"
            cat deploy/traefik/traefik-config.yaml
          } | kubeconform -strict -summary -kubernetes-version 1.36.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Dashboard JSON is well-formed
        run: jq empty deploy/monitoring/dashboards/*.json

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: app
          push: false
