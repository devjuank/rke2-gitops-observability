# workload-api in namespace `app`. Deployed by Argo CD from the main branch
# (deploy/argocd/application.yaml); don't kubectl apply it.
#
# The image tag below is the only thing that changes per release: the release
# workflow bumps it with `kustomize edit set image` in a deploy PR. Always an
# immutable sha- tag, never latest.
#
# Keep comments up here: `kustomize edit` rewrites the body and drops inline ones.
# servicemonitor.yaml needs the Prometheus Operator CRDs, which `make deploy`
# installs before Argo CD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- servicemonitor.yaml

images:
- name: ghcr.io/devjuank/workload-api
  newTag: sha-1152fcd
