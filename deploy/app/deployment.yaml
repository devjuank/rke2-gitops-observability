apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-api
  labels:
    app.kubernetes.io/name: workload-api
spec:
  replicas: 2
  # Zero downtime: start one new pod, wait until it's Ready, then remove an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-api
    spec:
      # The app doesn't call the Kubernetes API.
      automountServiceAccountToken: false
      # Covers the app's shutdown: 5s not-ready delay + up to 10s draining.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # distroless's "nonroot" user. Must be numeric: the kubelet can't verify
        # that a user *name* from the image isn't root, and refuses to start it.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload-api
          image: ghcr.io/devjuank/workload-api # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            # Behavior is configured here, so it can be changed through Git.
            - name: WORK_MAX_LATENCY_MS
              value: "500"
            - name: WORK_ERROR_RATE
              value: "0.05"
            - name: STARTUP_DELAY_SECONDS
              value: "5" # makes readiness gating visible during rollouts
          # Readiness: gates traffic. Probed often and fails fast, so a pod leaves
          # the Service quickly when it reports 503 (startup or shutdown).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          # Liveness: restarts a hung process. Never checks dependencies, and is
          # more tolerant than readiness to avoid restarts on a brief stall.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi # contains leaks; the Go service uses ~15Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
